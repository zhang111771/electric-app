<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电网智能体</title>
<style>
  :root { --bg:#f3f4f6; --panel:#fff; --accent:#2563eb; --text:#111827; --muted:#6b7280; --user:#2563eb; --bot:#fff; --code-bg:#0f172a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Microsoft YaHei", system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { background:#0f172a; color:#fff; padding:14px 20px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; font-weight:600; }
  header span { font-size:12px; color:#94a3b8; }
  #chat { flex:1; overflow-y:auto; padding:20px; max-width:860px; width:100%; margin:0 auto; }
  .row { display:flex; margin-bottom:16px; gap:10px; }
  .row.user { justify-content:flex-end; }
  .avatar { width:34px; height:34px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .user .avatar { background:var(--user); color:#fff; order:2; }
  .bot .avatar { background:#e5e7eb; }
  .bubble { max-width:78%; padding:12px 14px; border-radius:12px; line-height:1.7; font-size:15px; word-break:break-word; overflow-wrap:break-word; }
  .user .bubble { background:var(--user); color:#fff; border-top-right-radius:2px; white-space:pre-wrap; }
  .bot .bubble { background:var(--bot); border:1px solid #e5e7eb; border-top-left-radius:2px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .bubble .bold { font-weight:700; }
  .bubble .ref { color:var(--muted); font-size:12px; }

  /* markdown 富展示 */
  .bubble h1, .bubble h2, .bubble h3 { margin:8px 0 4px; line-height:1.4; }
  .bubble h1 { font-size:18px; } .bubble h2 { font-size:16px; } .bubble h3 { font-size:15px; }
  .bubble p { margin:6px 0; }
  .bubble ul, .bubble ol { margin:6px 0; padding-left:22px; }
  .bubble li { margin:2px 0; }
  .bubble blockquote { margin:8px 0; padding:6px 12px; border-left:3px solid var(--accent); background:#f8fafc; color:var(--muted); border-radius:0 6px 6px 0; }
  .bubble code.inl { background:#eef1f5; color:#be185d; padding:1px 5px; border-radius:4px; font-family:Consolas, Monaco, monospace; font-size:13px; }
  .bubble a { color:var(--accent); text-decoration:none; } .bubble a:hover { text-decoration:underline; }
  .bubble img { max-width:100%; max-height:360px; border-radius:8px; margin:6px 0; display:block; }
  .bubble table { border-collapse:collapse; margin:8px 0; max-width:100%; display:block; overflow-x:auto; font-size:14px; }
  .bubble th, .bubble td { border:1px solid #d1d5db; padding:6px 10px; text-align:left; white-space:nowrap; }
  .bubble th { background:#f1f5f9; font-weight:600; }
  .bubble tr:nth-child(even) td { background:#fafbfc; }
  .codeblock { margin:8px 0; border-radius:8px; overflow:hidden; background:var(--code-bg); }
  .codeblock .codehead { display:flex; justify-content:space-between; align-items:center; padding:4px 10px; background:#1e293b; color:#94a3b8; font-size:12px; }
  .codeblock .copybtn { background:#334155; color:#e2e8f0; border:none; border-radius:4px; padding:2px 10px; font-size:12px; cursor:pointer; }
  .codeblock .copybtn:hover { background:#475569; }
  .codeblock pre { margin:0; padding:10px 12px; overflow-x:auto; }
  .codeblock code { font-family:Consolas, Monaco, monospace; font-size:13px; color:#e2e8f0; white-space:pre; }

  .chart { margin-top:10px; }
  .chart svg { display:block; }
  .typing { display:inline-block; color:var(--muted); }
  #inputbar { background:var(--panel); border-top:1px solid #e5e7eb; padding:14px 20px; }
  #inputbox { max-width:860px; margin:0 auto; display:flex; gap:10px; }
  textarea { flex:1; border:1px solid #d1d5db; border-radius:10px; padding:10px 12px; font-size:15px; resize:none; font-family:inherit; line-height:1.5; max-height:120px; }
  textarea:focus { outline:none; border-color:var(--accent); }
  button { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:0 22px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .hint { font-size:12px; color:var(--muted); text-align:center; padding:6px; }
  /* 顶部标签切换 */
  .nav { margin-left:auto; display:flex; gap:6px; }
  .nav button { background:transparent; color:#cbd5e1; border:1px solid #334155; border-radius:8px; padding:6px 14px; font-size:13px; }
  .nav button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  /* 知识库管理 */
  #kbview { flex:1; overflow-y:auto; padding:20px; max-width:960px; width:100%; margin:0 auto; }
  .kb-toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .kb-toolbar input[type=text], .kb-toolbar select { border:1px solid #d1d5db; border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit; background:#fff; }
  .kb-toolbar input[type=text] { flex:1; min-width:200px; }
  .kb-toolbar button { padding:8px 16px; border-radius:8px; font-size:14px; }
  .kb-ghost { background:#fff; color:#374151; border:1px solid #d1d5db; }
  .kb-danger { background:#dc2626; }
  #kbStats { font-size:13px; color:var(--muted); white-space:nowrap; }
  .kb-panel { background:var(--panel); border:1px solid #e5e7eb; border-radius:12px; padding:16px; margin-bottom:16px; }
  .kb-panel h3 { font-size:15px; margin-bottom:10px; }
  .kb-panel input, .kb-panel textarea { width:100%; border:1px solid #d1d5db; border-radius:8px; padding:8px 10px; font-size:14px; margin-bottom:8px; font-family:inherit; }
  .kb-panel textarea { min-height:90px; resize:vertical; }
  .kb-form-row { display:flex; gap:10px; } .kb-form-row input { flex:1; }
  .kb-panel .btnrow { display:flex; align-items:center; gap:10px; }
  .kb-panel .btnrow button { padding:8px 20px; }
  #kbMsg { font-size:13px; }
  .kb-ok { color:#16a34a; } .kb-err { color:#dc2626; }
  .kb-table { width:100%; border-collapse:collapse; font-size:13px; }
  .kb-table th, .kb-table td { border:1px solid #e5e7eb; padding:6px 8px; text-align:left; vertical-align:top; }
  .kb-table th { background:#f1f5f9; font-weight:600; white-space:nowrap; }
  .kb-table .kb-text { max-width:380px; word-break:break-word; }
  .kb-table .kb-src { white-space:nowrap; }
  .kb-table .kb-actions { white-space:nowrap; }
  .kb-table .kb-actions button { padding:3px 10px; font-size:12px; border-radius:6px; margin-right:4px; }
  .kb-edit { background:var(--accent); } .kb-del { background:#dc2626; }
  #kbEmpty { color:var(--muted); text-align:center; padding:30px; }
</style>
</head>
<body>
<header>
  <h1>⚡ 电网智能体</h1>
  <span>调度运行 · 知识问答 · 数据查询 · 负荷预测</span>
  <div class="nav">
    <button data-tab="chat" class="active" type="button">对话</button>
    <button data-tab="kb" type="button">知识库管理</button>
  </div>
</header>

<div id="chat"></div>

<div id="kbview" style="display:none">
  <div class="kb-toolbar">
    <input type="text" id="kbSearch" placeholder="搜索内容 / 章节…">
    <select id="kbSourceFilter"><option value="">全部来源</option></select>
    <span id="kbStats"></span>
    <button class="kb-ghost" id="btnRefresh" type="button">刷新</button>
    <button class="kb-ghost" id="btnRebuild" type="button">从 markdown 重建</button>
  </div>
  <div class="kb-panel">
    <h3 id="kbFormTitle">新增知识块</h3>
    <div class="kb-form-row">
      <input type="text" id="kbNewSource" placeholder="来源（文件名或主题，如 06_调度规程补充.md）" list="kbSourceList">
      <datalist id="kbSourceList"></datalist>
      <input type="text" id="kbNewSection" placeholder="章节（可选，如 过负荷运行）">
    </div>
    <textarea id="kbNewText" placeholder="正文内容… 保存后自动编码向量，立即参与检索"></textarea>
    <div class="btnrow">
      <button id="btnAdd" type="button">添加并编码</button>
      <button class="kb-ghost" id="btnCancelEdit" type="button" style="display:none">取消编辑</button>
      <span id="kbMsg"></span>
    </div>
  </div>
  <div class="kb-panel">
    <h3>知识块列表 <span style="font-weight:400;color:var(--muted);font-size:12px" id="kbListInfo"></span></h3>
    <div style="overflow-x:auto">
      <table class="kb-table" id="kbTable" style="display:none">
        <thead><tr><th>ID</th><th>来源</th><th>章节</th><th>内容</th><th>操作</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="kbEmpty">暂无知识块，可在上方新增，或「从 markdown 重建」导入 data/assets/ 下的规程文件。</div>
  </div>
</div>

<div id="inputbar">
  <div id="inputbox">
    <textarea id="input" rows="1" placeholder="试试问：变压器过负荷运行有什么规定？/ 有哪些110kV主变？/ 预测城东变电站1号主变明天负荷"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint">回车发送 · Shift+回车换行 · 多轮对话自带上下文记忆</div>
</div>

<script>
let sessionId = localStorage.getItem('grid_session') || '';
if (!sessionId) { sessionId = Math.random().toString(16).slice(2); localStorage.setItem('grid_session', sessionId); }

const chatEl = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ========== 行内渲染 ========== */
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code class="inl">$1</code>');
  s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" loading="lazy">');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/【([^】]+)】/g, '<span class="bold">【$1】</span>');
  return s;
}

/* ========== 流式轻量渲染（避免表格/代码块流式中抖动） ========== */
function renderStream(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code class="inl">$1</code>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/【([^】]+)】/g, '<span class="bold">【$1】</span>');
  return s.replace(/\n/g, '<br>');
}

/* ========== 代码块（带复制按钮） ========== */
function renderCodeBlock(lang, code) {
  const id = 'cb' + Math.random().toString(36).slice(2);
  return '<div class="codeblock">'
    + '<div class="codehead"><span>' + esc(lang || 'code') + '</span>'
    + '<button class="copybtn" data-cb="' + id + '" type="button">复制</button></div>'
    + '<pre><code>' + esc(code) + '</code></pre></div>';
}

/* ========== 表格 ========== */
function isSeparatorRow(l) { return /-/.test(l) && !/[a-zA-Z0-9一-鿿]/.test(l); }

function renderTable(lines, start) {
  const rows = [];
  let i = start;
  while (i < lines.length && /^\s*\|/.test(lines[i])) {
    rows.push(lines[i].trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
    i++;
  }
  const head = rows[0] || [];
  let h = '<table><thead><tr>';
  for (const c of head) h += '<th>' + inline(c) + '</th>';
  h += '</tr></thead><tbody>';
  for (let r = 2; r < rows.length; r++) {
    h += '<tr>';
    for (let c = 0; c < head.length; c++) h += '<td>' + inline(rows[r][c] ?? '') + '</td>';
    h += '</tr>';
  }
  h += '</tbody></table>';
  return { html: h, next: i };
}

/* ========== 完整 markdown 渲染 ========== */
function renderMarkdown(s) {
  const lines = s.replace(/\r\n/g, '\n').split('\n');
  let html = '', i = 0;
  const para = [];
  const flush = () => { if (para.length) { html += '<p>' + inline(para.join('\n')) + '</p>'; para.length = 0; } };

  while (i < lines.length) {
    const line = lines[i];

    // 代码块 ```lang ... ```
    const fm = line.match(/^```(\w*)/);
    if (fm) {
      flush();
      const lang = fm[1]; i++;
      const buf = [];
      while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      html += renderCodeBlock(lang, buf.join('\n'));
      continue;
    }

    // 表格：本行是表头、下一行是对齐分隔行
    if (/^\s*\|/.test(line) && i + 1 < lines.length && isSeparatorRow(lines[i + 1])) {
      flush();
      const t = renderTable(lines, i);
      html += t.html; i = t.next;
      continue;
    }

    // 标题
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if (h) { flush(); const lv = h[1].length; html += '<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>'; i++; continue; }

    // 引用
    if (/^>\s?/.test(line)) {
      flush();
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      html += '<blockquote>' + inline(buf.join('\n')) + '</blockquote>';
      continue;
    }

    // 无序/有序列表
    if (/^\s*[-*+]\s+/.test(line)) {
      flush(); html += '<ul>';
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { html += '<li>' + inline(lines[i].replace(/^\s*[-*+]\s+/, '')) + '</li>'; i++; }
      html += '</ul>';
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      flush(); html += '<ol>';
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { html += '<li>' + inline(lines[i].replace(/^\s*\d+\.\s+/, '')) + '</li>'; i++; }
      html += '</ol>';
      continue;
    }

    if (!line.trim()) { flush(); i++; continue; }
    para.push(line); i++;
  }
  flush();
  return html;
}

/* ========== 图表 ========== */
function renderChart(chart) {
  if (!chart) return '';
  if (chart.type === 'cable_fault') return renderCableChart(chart);
  if (!chart.series || !chart.series.length) return '';
  return chart.type === 'bar' ? renderBarChart(chart) : renderLineChart(chart);
}

function renderLineChart(chart) {
  const w = 560, h = 200, pad = 42;
  const x = chart.x || [];
  const series = chart.series;
  const all = series.flatMap(s => s.data);
  const min = Math.min(...all), max = Math.max(...all);
  const range = (max - min) || 1;
  const colors = ['#e4572e', '#2563eb', '#16a34a', '#7c3aed'];
  const px = i => pad + i * (w - pad * 2) / Math.max(x.length - 1, 1);
  const py = v => h - pad - (v - min) / range * (h - pad * 2);
  let svg = `<svg viewBox="0 0 ${w} ${h}" style="background:#fafafa;border:1px solid #e5e7eb;border-radius:8px" width="100%">`;
  for (let g = 0; g <= 4; g++) {
    const y = pad + g * (h - 2 * pad) / 4;
    const v = max - g * range / 4;
    svg += `<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="#e5e7eb"/>`;
    svg += `<text x="${pad-6}" y="${y+4}" font-size="11" fill="#9ca3af" text-anchor="end">${v.toFixed(1)}</text>`;
  }
  series.forEach((s, si) => {
    const c = colors[si % colors.length];
    const pts = s.data.map((v, i) => `${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' ');
    svg += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>`;
    svg += `<circle cx="${px(s.data.length-1).toFixed(1)}" cy="${py(s.data[s.data.length-1]).toFixed(1)}" r="3" fill="${c}"/>`;
  });
  const step = Math.max(1, Math.floor(x.length / 6));
  x.forEach((lab, i) => { if (i % step === 0) svg += `<text x="${px(i)}" y="${h-12}" font-size="10" fill="#9ca3af" text-anchor="middle">${esc(lab)}</text>`; });
  series.forEach((s, si) => {
    const c = colors[si % colors.length];
    svg += `<rect x="${w-180+si*90}" y="12" width="10" height="10" fill="${c}"/>`;
    svg += `<text x="${w-166+si*90}" y="21" font-size="11" fill="#374151">${esc(s.name)}</text>`;
  });
  svg += `<text x="${pad}" y="16" font-size="13" font-weight="600" fill="#1f2937">${esc(chart.title||'')}</text>`;
  svg += '</svg>';
  return `<div class="chart">${svg}</div>`;
}

function renderBarChart(chart) {
  const w = 560, h = 220, pad = 42;
  const x = chart.x || [];
  const series = chart.series;
  const max = Math.max(...series.flatMap(s => s.data));
  const range = max || 1;
  const colors = ['#2563eb', '#16a34a', '#7c3aed', '#e4572e'];
  const bw = (w - pad * 2) / Math.max(x.length, 1);
  const barW = bw * 0.7 / Math.max(series.length, 1);
  const yOf = v => h - pad - (v / range) * (h - 2 * pad);
  const y0 = h - pad;
  let svg = `<svg viewBox="0 0 ${w} ${h}" style="background:#fafafa;border:1px solid #e5e7eb;border-radius:8px" width="100%">`;
  for (let g = 0; g <= 4; g++) {
    const y = pad + g * (h - 2 * pad) / 4;
    const v = max - g * range / 4;
    svg += `<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="#e5e7eb"/>`;
    svg += `<text x="${pad-6}" y="${y+4}" font-size="11" fill="#9ca3af" text-anchor="end">${v.toFixed(0)}</text>`;
  }
  svg += `<line x1="${pad}" y1="${y0}" x2="${w-pad}" y2="${y0}" stroke="#d1d5db"/>`;
  series.forEach((s, si) => {
    const c = colors[si % colors.length];
    s.data.forEach((v, i) => {
      const x0 = pad + i * bw + bw * 0.15 + si * barW;
      const yv = yOf(v);
      svg += `<rect x="${x0.toFixed(1)}" y="${yv.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(y0 - yv, 0).toFixed(1)}" fill="${c}" rx="2"/>`;
    });
  });
  const step = Math.max(1, Math.floor(x.length / 6));
  x.forEach((lab, i) => { if (i % step === 0) svg += `<text x="${pad + i * bw + bw / 2}" y="${h-12}" font-size="10" fill="#9ca3af" text-anchor="middle">${esc(String(lab))}</text>`; });
  series.forEach((s, si) => {
    const c = colors[si % colors.length];
    svg += `<rect x="${w-180+si*90}" y="12" width="10" height="10" fill="${c}"/>`;
    svg += `<text x="${w-166+si*90}" y="21" font-size="11" fill="#374151">${esc(s.name)}</text>`;
  });
  svg += `<text x="${pad}" y="16" font-size="13" font-weight="600" fill="#1f2937">${esc(chart.title||'')}</text>`;
  svg += '</svg>';
  return `<div class="chart">${svg}</div>`;
}

function renderCableChart(chart) {
  // 水平电缆示意图：左端 SRC、右端 LDR，红点标故障位置
  const w = 560, h = 120, pad = 42;
  const pos = Number(chart.position_m) || 0;
  const len = Number(chart.cable_len_m) || 4800;
  const ratio = Math.max(0, Math.min(1, pos / len));
  const y0 = h / 2 + 10;
  const xSrc = pad, xLdr = w - pad;
  const xFault = pad + ratio * (w - 2 * pad);
  const ok = chart.within_acceptance !== false;
  let svg = `<svg viewBox="0 0 ${w} ${h}" style="background:#fafafa;border:1px solid #e5e7eb;border-radius:8px" width="100%">`;
  svg += `<text x="${pad}" y="18" font-size="13" font-weight="600" fill="#1f2937">${esc(chart.title || '电缆故障定位')}</text>`;
  svg += `<line x1="${xSrc}" y1="${y0}" x2="${xLdr}" y2="${y0}" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>`;
  svg += `<circle cx="${xSrc}" cy="${y0}" r="6" fill="#2563eb"/>`;
  svg += `<text x="${xSrc}" y="${y0 + 22}" font-size="11" fill="#374151" text-anchor="middle">源端 SRC</text>`;
  svg += `<circle cx="${xLdr}" cy="${y0}" r="6" fill="#2563eb"/>`;
  svg += `<text x="${xLdr}" y="${y0 + 22}" font-size="11" fill="#374151" text-anchor="middle">负荷端 LDR</text>`;
  svg += `<circle cx="${xFault.toFixed(1)}" cy="${y0}" r="7" fill="#e4572e" stroke="#fff" stroke-width="2"/>`;
  svg += `<line x1="${xFault.toFixed(1)}" y1="${y0 - 20}" x2="${xFault.toFixed(1)}" y2="${y0 - 8}" stroke="#e4572e" stroke-width="1.5"/>`;
  svg += `<text x="${xFault.toFixed(1)}" y="${y0 - 24}" font-size="12" font-weight="600" fill="#e4572e" text-anchor="middle">故障 ${pos.toFixed(1)}m</text>`;
  svg += `<text x="${(xSrc + xLdr) / 2}" y="${y0 + 38}" font-size="11" fill="#6b7280" text-anchor="middle">电缆全长 ${len.toFixed(0)}m · 验收${ok ? '通过' : '未通过'}</text>`;
  svg += '</svg>';
  return `<div class="chart">${svg}</div>`;
}

function addMessage(text, role) {
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '🧑' : '🤖';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (text) bubble.innerHTML = role === 'user' ? renderStream(text) : renderMarkdown(text);
  row.appendChild(avatar); row.appendChild(bubble);
  chatEl.appendChild(row);
  return bubble;
}

function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

/* 代码块复制按钮（事件委托） */
chatEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('.copybtn');
  if (!btn) return;
  const code = btn.closest('.codeblock').querySelector('pre code').textContent;
  try {
    await navigator.clipboard.writeText(code);
    btn.textContent = '已复制';
    setTimeout(() => { btn.textContent = '复制'; }, 1500);
  } catch (err) {
    btn.textContent = '复制失败';
  }
});

async function send() {
  const msg = input.value.trim();
  if (!msg) return;
  input.value = ''; input.style.height = 'auto';
  addMessage(msg, 'user');
  const bot = addMessage('', 'bot');
  bot.innerHTML = '<span class="typing">思考中…</span>';
  scrollBottom();

  let full = '', chart = null;
  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, session_id: sessionId })
    });
    if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    bot.innerHTML = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf('\n\n')) >= 0) {
        const raw = buffer.slice(0, idx); buffer = buffer.slice(idx + 2);
        for (const line of raw.split('\n')) {
          if (!line.startsWith('data: ')) continue;
          const evt = JSON.parse(line.slice(6));
          if (evt.type === 'token') { full += evt.content; bot.innerHTML = renderStream(full); scrollBottom(); }
          else if (evt.type === 'error') { bot.innerHTML = '<span style="color:#dc2626">' + esc(evt.content).replace(/\n/g,'<br>') + '</span>'; }
          else if (evt.type === 'done' && evt.chart) chart = evt.chart;
        }
      }
    }
  } catch (e) {
    bot.innerHTML = '<span style="color:#dc2626">请求失败：' + esc(String(e)) + '</span>';
  }
  bot.innerHTML = (full ? renderMarkdown(full) : '') + renderChart(chart);
  if (!full && !chart) bot.innerHTML = '<span style="color:#6b7280">（未收到回复）</span>';
  scrollBottom();
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; });

/* ========== 知识库管理 ========== */
const kbview = document.getElementById('kbview');
const chatView = document.getElementById('chat');
const inputbar = document.getElementById('inputbar');
const kbChunkMap = {};   // id → 完整 chunk（编辑时取全文）
let kbEditId = null;

function showTab(name) {
  const isChat = name === 'chat';
  chatView.style.display = isChat ? '' : 'none';
  inputbar.style.display = isChat ? '' : 'none';
  kbview.style.display = isChat ? 'none' : '';
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  if (!isChat) loadKb();
}
document.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

async function kbApi(path, opts) {
  const resp = await fetch(path, opts);
  if (!resp.ok) {
    let detail = 'HTTP ' + resp.status;
    try { detail = (await resp.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return resp.json();
}

function kbMsg(text, ok) {
  const el = document.getElementById('kbMsg');
  el.className = ok ? 'kb-ok' : 'kb-err';
  el.textContent = text;
}

async function loadKbStats() {
  try {
    const s = await kbApi('/api/kb/stats');
    const parts = s.by_source.map(x => esc(x.source) + ' ×' + x.count);
    document.getElementById('kbStats').innerHTML = '共 <b>' + s.total + '</b> 块 · ' + parts.join(' · ');
  } catch (e) { document.getElementById('kbStats').textContent = ''; }
}

async function loadKbSources() {
  try {
    const s = await kbApi('/api/kb/sources');
    const sel = document.getElementById('kbSourceFilter');
    const cur = sel.value;
    sel.innerHTML = '<option value="">全部来源</option>' + s.sources.map(x => '<option value="' + esc(x) + '">' + esc(x) + '</option>').join('');
    sel.value = cur;
    document.getElementById('kbSourceList').innerHTML = s.sources.map(x => '<option value="' + esc(x) + '"></option>').join('');
  } catch (e) {}
}

async function loadKbChunks() {
  const q = document.getElementById('kbSearch').value.trim();
  const src = document.getElementById('kbSourceFilter').value;
  const tbody = document.querySelector('#kbTable tbody');
  const table = document.getElementById('kbTable');
  const empty = document.getElementById('kbEmpty');
  try {
    const r = await kbApi('/api/kb/chunks?q=' + encodeURIComponent(q) + '&source=' + encodeURIComponent(src) + '&limit=300');
    const chunks = r.chunks;
    document.getElementById('kbListInfo').textContent = chunks.length + ' 条';
    tbody.innerHTML = '';
    for (const c of chunks) kbChunkMap[c.id] = c;
    if (!chunks.length) { table.style.display = 'none'; empty.style.display = ''; return; }
    table.style.display = ''; empty.style.display = 'none';
    for (const c of chunks) {
      const tr = document.createElement('tr');
      const preview = c.text.length > 90 ? c.text.slice(0, 90) + '…' : c.text;
      tr.innerHTML = '<td>' + c.id + '</td>'
        + '<td class="kb-src">' + esc(c.source) + '</td>'
        + '<td>' + esc(c.section) + '</td>'
        + '<td class="kb-text">' + esc(preview) + '</td>'
        + '<td class="kb-actions">'
        + '<button class="kb-edit" data-id="' + c.id + '" type="button">编辑</button>'
        + '<button class="kb-del" data-id="' + c.id + '" type="button">删除</button></td>';
      tbody.appendChild(tr);
    }
  } catch (e) { kbMsg(String(e), false); }
}

async function loadKb() { await loadKbStats(); await loadKbSources(); await loadKbChunks(); }

function resetForm() {
  kbEditId = null;
  document.getElementById('kbFormTitle').textContent = '新增知识块';
  document.getElementById('btnAdd').textContent = '添加并编码';
  document.getElementById('btnCancelEdit').style.display = 'none';
  document.getElementById('kbNewSource').value = '';
  document.getElementById('kbNewSection').value = '';
  document.getElementById('kbNewText').value = '';
  document.getElementById('kbMsg').textContent = '';
}

document.getElementById('btnRefresh').addEventListener('click', loadKb);

document.getElementById('btnRebuild').addEventListener('click', async () => {
  if (!confirm('将从 data/assets/ 下的 markdown 全量重建知识库（清空现有所有 chunk 后重新入库），确定继续？')) return;
  const btn = document.getElementById('btnRebuild');
  btn.disabled = true; btn.textContent = '重建中…';
  kbMsg('正在编码入库（耗时取决于知识库大小）…', true);
  try {
    const r = await kbApi('/api/kb/rebuild', { method: 'POST' });
    kbMsg(r.message, true);
    resetForm(); await loadKb();
  } catch (e) { kbMsg(String(e), false); }
  btn.disabled = false; btn.textContent = '从 markdown 重建';
});

document.getElementById('btnAdd').addEventListener('click', async () => {
  const source = document.getElementById('kbNewSource').value.trim();
  const section = document.getElementById('kbNewSection').value.trim();
  const text = document.getElementById('kbNewText').value.trim();
  if (!text) { kbMsg('请填写正文内容', false); return; }
  if (!source) { kbMsg('请填写来源', false); return; }
  const btn = document.getElementById('btnAdd');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '编码中…';
  try {
    if (kbEditId) {
      await kbApi('/api/kb/chunks/' + kbEditId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source, section, text }) });
      kbMsg('已保存修改，向量已更新', true);
    } else {
      const r = await kbApi('/api/kb/chunks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source, section, text }) });
      kbMsg('已添加并编码（ID ' + r.id + '），立即可用于检索', true);
    }
    resetForm(); await loadKb();
  } catch (e) { kbMsg(String(e), false); }
  btn.disabled = false; btn.textContent = label;
});

document.getElementById('btnCancelEdit').addEventListener('click', () => { resetForm(); loadKb(); });

let kbSearchTimer;
document.getElementById('kbSearch').addEventListener('input', () => {
  clearTimeout(kbSearchTimer);
  kbSearchTimer = setTimeout(loadKbChunks, 300);
});
document.getElementById('kbSourceFilter').addEventListener('change', loadKbChunks);

document.querySelector('#kbTable tbody').addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const id = Number(btn.dataset.id);
  if (btn.classList.contains('kb-del')) {
    if (!confirm('确定删除该知识块（ID ' + id + '）？')) return;
    try { await kbApi('/api/kb/chunks/' + id, { method: 'DELETE' }); kbMsg('已删除', true); await loadKb(); }
    catch (err) { kbMsg(String(err), false); }
  } else if (btn.classList.contains('kb-edit')) {
    const c = kbChunkMap[id];
    if (!c) return;
    kbEditId = id;
    document.getElementById('kbFormTitle').textContent = '编辑知识块 #' + id;
    document.getElementById('btnAdd').textContent = '保存修改';
    document.getElementById('btnCancelEdit').style.display = '';
    document.getElementById('kbNewSource').value = c.source;
    document.getElementById('kbNewSection').value = c.section;
    document.getElementById('kbNewText').value = c.text;
    document.getElementById('kbMsg').textContent = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});
</script>
