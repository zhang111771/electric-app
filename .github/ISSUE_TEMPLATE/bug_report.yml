name: 🐛 Bug 报告
description: 提交一个 Bug 反馈
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰、简洁地描述遇到的问题。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统 / Python 与 Node 版本 / Docker 部署还是本地运行？
      placeholder: 如 Windows 11 / Python 3.11 / Node 20 / 本地运行
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 一步一步如何触发这个 Bug？
      placeholder: |
        1. 启动后端...
        2. 提问「...」
        3. 看到报错
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 相关报错日志、服务端输出或截图。
    validations:
      required: false
